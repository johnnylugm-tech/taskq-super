[tool:pytest]
# Project-level pytest configuration.
# This file is needed because mutmut runs pytest from a temp workdir and
# only copies setup.cfg (not pyproject.toml) into it. The pytest-asyncio
# plugin is required by FR-08's async tests, and the framework's
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 default means we must explicitly
# request it via -p asyncio in addopts.
addopts = -p asyncio
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

[mutmut]
# NFR-08: scope mutation testing to the high-risk modules declared in
# the SAB. The full 03-development/src contains too many lines for the
# 60-minute cap; service + repository are the layers the spec actually
# gates mutation score on.
paths_to_mutate=03-development/src/taskq_api/service,03-development/src/taskq_api/repository/task_repo.py,03-development/src/taskq_api/repository/rate_repo.py
runner=python3 -m pytest --tb=no -q -p no:cacheprovider
